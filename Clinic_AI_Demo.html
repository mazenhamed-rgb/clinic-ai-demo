{name(r)[0]}</div><div class="info"><b>${name(r)}</b><br><small>${st(r)}</small></div><b dir="ltr">${fmtTime(r.time)}</b></div>`).join('')||`<p>${T('لا توجد مواعيد','No appointments')}</p>`}<button style="width:100%;margin-top:16px" onclick="go(1)">${T('عرض جميع المواعيد','All appointments')} ←</button></div>`}function overview(){let a=active(),c=a.filter(r=>r.status==='confirmed').length,channels=['Unknown'],colors=['#9271ff','#4b9cff','#f4c66b','#31cdbd'],counts=channels.map(s=>a.filter(r=>r.src===s).length),sum=0,stops=counts.map((n,i)=>{let start=sum;sum+=a.length?n/a.length*100:0;return `${colors[i]} ${start}% ${sum}%`}).join(',');return `<div class="layout"><div class="center"><div class="card hero"><img src="${ART[light?1:0]}" alt="AI assistant artwork"><div class="copy"><h2>${T('المساعد الذكي للعيادة','Your AI receptionist')}</h2><p>${T('استقبال المرضى وتنظيم المواعيد على مدار الساعة','Patient support and scheduling around the clock')}</p><span class="pill">● ${ai?T('نشط تجريبيًا','Demo active'):T('متوقف','Paused')}</span></div></div><div class="kpis">${[[a.length,T('حجوزات اليوم','Today bookings'),'#9471ff','▣'],[c,T('حجوزات مؤكدة','Confirmed'),'#32c9a2','✓'],[a.filter(r=>r.status==='pending').length,T('في انتظار التأكيد','Pending'),'#f1c16a','◷'],['—',T('مواعيد متاحة','Available'),'#32c6df','⊕']].map(x=>`<div class="kpi" style="--c:${x[2]}"><div class="row"><span class="num">${String(x[0]).padStart(2,'0')}</span><span class="ico">${x[3]}</span></div><b>${x[1]}</b><br><small>${T('بيانات الحجوزات','Booking data')}</small></div>`).join('')}</div><div class="pair"><div class="card"><div class="row"><h2>${T('أداء الحجوزات','Booking performance')}</h2><select onchange="period=+this.value;render()" style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px">${T(['يوم','أسبوع','شهر'],['Day','Week','Month']).map((s,i)=>`<option value="${i}" ${i===period?'selected':''}>${s}</option>`).join('')}</select></div>${graph()}<small>${T('غير متاح بعد','Not available yet')}</small></div><div class="card"><h2>${T('قنوات الحجز','Booking channels')}</h2><div class="row"><div class="donut" style="background:${a.length?'conic-gradient('+stops+')':'var(--line)'}"><b>${a.length}</b></div><div class="legend">${channels.map((s,i)=>`<div><span style="color:${colors[i]}">●</span> ${T('غير محدد','Unknown')} <b>${counts[i]}</b></div>`).join('')}</div></div></div></div><div class="pair"><div class="card"><h2>${T('مؤشرات الأداء','Performance indicators')}</h2><div class="metrics"><div><b>—</b><small>${T('دقيقة للرد','Response min')}</small></div><div><b>—</b><small>${T('التقييم','Rating')}</small></div><div><b>—</b><small>${T('رضا المرضى','Satisfaction')}</small></div></div><small>${T('غير متاحة بعد','Not available yet')}</small></div><div class="card"><h2>${T('إجراءات سريعة','Quick actions')}</h2><div class="quick"><button class="primary" onclick="book()">＋ ${T('حجز جديد','New booking')}</button><button onclick="go(2)">${T('المرضى','Patients')}</button><button onclick="go(3)">${T('المحادثات','Inbox')}</button><button onclick="go(5)">${T('التقارير','Reports')}</button></div></div></div></div><div class="rail">${calendar()}${list()}</div></div>`}function table(){return `<div class="card tablewrap"><table><thead><tr>${T(['المريض','رقم الحجز','التاريخ','الوقت','الحالة',''],['Patient','Booking ID','Date','Time','Status','']).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.filter(r=>(r.n+r.en+code(r)).toLowerCase().includes(search.toLowerCase())).map(r=>`<tr><td>${name(r)}</td><td>${code(r)}</td><td>${r.date}</td><td>${fmtTime(r.time)}</td><td>${st(r)}</td><td><button onclick="detail(${r.id})">···</button></td></tr>`).join('')}</tbody></table></div>`}function render(){document.body.className=light?'light':'';document.documentElement.dir=ar?'rtl':'ltr';document.documentElement.lang=ar?'ar':'en';side.innerHTML=`<div class="brand"><div class="logo">✚</div><span>Clinic AI<small>DEMO EDITION</small></span></div>${nav.map((n,i)=>`<button class="nav ${page===i?'active':''}" onclick="go(${i})"><i>${n[2]}</i><span>${T(n[0],n[1])}</span></button>`).join('')}<div class="pro"><b>✦ Clinic AI Pro</b><p style="color:#e3dfff">${T('ربط وحجز تجريبي','Booking pilot')}</p></div>`;header.innerHTML=`<input class="search" placeholder="${T('ابحث عن مريض أو رقم حجز…','Search patient or booking ID…')}" value="${E(search)}" oninput="search=this.value;page=1;document.getElementById('content').innerHTML=table()"><div class="row"><button onclick="loadRows()">${T('تحديث','Refresh')}</button><button onclick="logout()">${T('إعادة ضبط','Reset demo')}</button><button onclick="theme()">${light?'☾':'☀'}</button><button onclick="lang()">${T('EN','عربي')}</button><span class="profile">${T('د. أحمد عمر','Dr. Ahmed Omar')}</span><div class="avatar">DA</div></div>`;view.innerHTML=`<div class="intro row"><div><h1>${page===0?T('أهلاً، د. أحمد 👋','Welcome, Dr. Ahmed 👋'):T(nav[page][0],nav[page][1])}</h1><p>${new Intl.DateTimeFormat(ar?'ar-EG':'en-US',{dateStyle:'full',timeZone:'Africa/Cairo'}).format(new Date())+' · '+T('نسخة عرض — بيانات وهمية فقط','DEMO — fictional data only')}</p></div><button class="primary" onclick="book()">＋ ${T('حجز جديد','New booking')}</button></div><div id="content">${page===0?overview():page===1?table():page===2?`<div class="card">${rows.map(r=>`<div class="person"><div class="avatar">${name(r)[0]}</div><b class="info">${name(r)}</b><button onclick="detail(${r.id})">${T('التفاصيل','Details')}</button></div>`).join('')}</div>`:page===4?`<div class="card"><h2>AI Receptionist</h2><button onclick="ai=!ai;render()">${ai?T('إيقاف تجريبي','Pause demo'):T('تشغيل تجريبي','Enable demo')}</button><p>${T('غير متصل بالنظام الحقيقي','Not connected to live system')}</p></div>`:page===5?`<div class="card">${graph()}<p>${T('بيانات توضيحية','Illustrative data')}</p></div>`:page===6?`<div class="card">${['WhatsApp Business','Google Calendar','Supabase','Website Widget','n8n'].map(x=>`<div class="person"><b class="info">${x}</b><small>${x==='Supabase'?T('غير متصل','Not connected'):T('غير متصل','Not connected')}</small></div>`).join('')}</div>`:page===8?`<div class="card"><button onclick="theme()">${T('تغيير المظهر','Change theme')}</button> <button onclick="lang()">${T('تغيير اللغة','Change language')}</button></div>`:`<div class="card">${T('هذه الصفحة قيد التطوير','This module is in development')}</div>`}</div>`}function cairoInstant(date,time){const target=Date.parse(date+'T'+time+':00Z');let t=target;for(let i=0;i<4;i++){const p=parts(t);const actual=Date.parse(`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:00Z`);if(actual===target)return new Date(t);t+=target-actual;}throw Error(T('وقت غير صالح','Invalid time'));}
function book(){if(!token)return;const selected=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;dlg.innerHTML=`<h2>${T('حجز جديد','New booking')}</h2><p>${T('اختر بيانات الحجز والموعد المطلوب. استخدم بيانات وهمية فقط؛ لا يتم إرسالها لأي خادم.','Choose the booking details and time. Use fictional data only; nothing is sent to a server.')}</p><form id="bookingForm"><label>${T('اسم المريض','Patient name')}<input name="patient_name" required maxlength="120" autocomplete="off"></label><label>${T('رقم الهاتف','Phone')}<input name="patient_phone" type="tel" dir="ltr" pattern="01[0125][0-9]{8}" required autocomplete="off" placeholder="01000000000"></label><label>${T('التاريخ','Date')}<input name="date" type="date" required min="${todayDate()}" value="${selected<todayDate()?todayDate():selected}"></label><label>${T('الموعد','Time')}<select name="time" required>${Array.from({length:12},(_,i)=>{const t=String(16+Math.floor(i/2)).padStart(2,'0')+':'+(i%2?'30':'00');return `<option value="${t}">${fmtTime(t)}</option>`}).join('')}</select></label><p id="bookingResult" role="status" aria-live="polite"></p><div class="row"><button class="primary" type="submit">${T('تأكيد الحجز','Confirm booking')}</button><button type="button" id="closeBooking">${T('إغلاق','Close')}</button></div></form>`;dlg.showModal();const form=dlg.querySelector('form'),out=dlg.querySelector('#bookingResult'),btn=form.querySelector('[type=submit]'),close=dlg.querySelector('#closeBooking');let busy=false;form.addEventListener('input',()=>{if(!busy&&!btn.disabled)out.textContent='';});close.onclick=()=>dlg.close();dlg.oncancel=e=>{if(busy)e.preventDefault()};form.onsubmit=async e=>{e.preventDefault();if(busy||!token)return;const f=new FormData(form);let start;try{start=cairoInstant(f.get('date'),f.get('time'));if(new Date(f.get('date')+'T12:00:00Z').getUTCDay()===5)throw Error(T('العيادة مغلقة يوم الجمعة','Closed on Friday'));if(start.getTime()<=Date.now())throw Error(T('اختر موعداً مستقبلياً','Choose a future time'));if(!f.get('patient_name').trim())throw Error(T('أدخل اسم المريض','Enter patient name'));}catch(err){out.textContent=err.message;return;}busy=true;btn.disabled=true;close.disabled=true;out.textContent=T('جاري إرسال الحجز…','Submitting booking…');try{const d=f.get('date'),t=f.get('time');if(rows.some(r=>r.date===d&&r.time===t&&r.status!=='cancelled')){out.textContent=T('الموعد محجوز بالفعل. اختر موعداً آخر.','Already booked. Choose another time.');btn.disabled=false;return;}const id=Math.max(0,...rows.map(r=>r.id))+1;const n=f.get('patient_name').trim();const booking='CL-DEMO-'+String(id).padStart(3,'0');rows.push({id,n,en:n,date:d,time:t,status:'confirmed',booking,src:'Unknown'});saveRows();render();out.textContent=T('تم تأكيد الحجز التجريبي! رقم الحجز: ','Demo booking confirmed! ID: ')+booking;}finally{busy=false;close.disabled=false;}};}

function detail(id){let r=rows.find(x=>x.id===id);if(!r)return;dlg.innerHTML=`<h2>${name(r)}</h2><p>${code(r)} · ${r.date} · ${fmtTime(r.time)}</p><p>${st(r)}</p><button onclick="dlg.close()">${T('إغلاق','Close')}</button>`;dlg.showModal()}
let token='demo';
function parts(v){let p=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(v));return Object.fromEntries(p.map(x=>[x.type,x.value]))}
function todayDate(){let p=parts(Date.now());return `${p.year}-${p.month}-${p.day}`}
let now=parts(Date.now());year=+now.year;month=+now.month-1;day=+now.day;
const storageKey='clinic-ai-demo-v1';
function seed(){return ['أحمد محمد','مريم خالد','عمر حسن','سارة علي'].map((n,i)=>({id:i+1,n,en:['Ahmed Mohamed','Mariam Khaled','Omar Hassan','Sara Ali'][i],date:todayDate(),time:['16:00','16:30','17:00','17:30'][i],status:i===3?'pending':'confirmed',booking:'CL-DEMO-00'+(i+1),src:'Unknown'}));}
function loadRows(){try{rows=JSON.parse(localStorage.getItem(storageKey))||(rows.length?rows:seed())}catch{if(!rows.length)rows=seed()}render();}
function saveRows(){try{localStorage.setItem(storageKey,JSON.stringify(rows))}catch{}}
function logout(){if(confirm(T('إعادة ضبط البيانات التجريبية؟','Reset demo data?'))){rows=seed();saveRows();go(0)}}
loadRows();</script></html>
